<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoToCSV - Exportateur de base de données</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0813;
            --text-color: #f1ecfa;
            --text-muted: #9f94b8;
            --primary: #8a2be2;
            --primary-hover: #9d4edd;
            --secondary: #e0aaff;
            --accent: #ff007f;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-focus: rgba(138, 43, 226, 0.3);
            --success: #00f0b5;
            --error: #ff3838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.6) 0%, rgba(0,0,0,0) 70%);
        }

        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.4) 0%, rgba(0,0,0,0) 70%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            box-shadow: 0 8px 24px rgba(138, 43, 226, 0.4);
            margin-bottom: 1rem;
            animation: float 6s ease-in-out infinite;
        }

        .logo-container svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.35);
        }

        /* Forms Layout */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group.hidden {
            display: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px var(--glass-focus);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Action Buttons */
        .actions {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 1rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            box-shadow: 0 8px 24px rgba(138, 43, 226, 0.3);
        }

        .btn-submit:hover {
            box-shadow: 0 12px 32px rgba(138, 43, 226, 0.5);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        /* Alerts and Status */
        .alert {
            display: none;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
            animation: slideIn 0.3s ease;
        }

        .alert-error {
            background: rgba(255, 56, 56, 0.15);
            border: 1px solid rgba(255, 56, 56, 0.3);
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 240, 181, 0.15);
            border: 1px solid rgba(0, 240, 181, 0.3);
            color: var(--success);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <header>
            <div class="logo-container">
                <svg viewBox="0 0 24 24">
                    <path d="M19 12v7H5v-7h14m1-2H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
                </svg>
            </div>
            <h1>MongoToCSV</h1>
            <p class="subtitle">Convertissez vos collections MongoDB en fichiers CSV propres et structurés</p>
        </header>

        <div class="card">
            <!-- Alert Display -->
            <div id="alert-box" class="alert"></div>

            <div class="tabs">
                <button type="button" class="tab-btn active" onclick="switchMode('uri')">URI MongoDB</button>
                <button type="button" class="tab-btn" onclick="switchMode('credentials')">Détails du Cluster</button>
            </div>

            <form id="export-form" onsubmit="handleExport(event)">
                <!-- Target connection mode hidden input -->
                <input type="hidden" id="connection-mode" value="uri">

                <!-- Mode 1: URI Fields -->
                <div id="uri-fields">
                    <div class="form-group">
                        <label for="uri">URI de connexion MongoDB</label>
                        <input type="text" id="uri" placeholder="mongodb+srv://user:password@cluster.mongodb.net/?appName=..." autocomplete="off">
                    </div>
                </div>

                <!-- Mode 2: Cluster credentials Fields -->
                <div id="credentials-fields" class="form-group hidden">
                    <div class="form-group">
                        <label for="cluster">Initiales / Hôte du Cluster</label>
                        <input type="text" id="cluster" placeholder="ex: cluster0.vvtqpfm (ou hôte complet)" autocomplete="off">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input type="text" id="username" placeholder="db_user" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" id="password" placeholder="••••••••" autocomplete="off">
                        </div>
                    </div>
                </div>

                <!-- Shared Database & Collection Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="db">Base de données</label>
                        <input type="text" id="db" placeholder="ex: ma_base_de_donnees" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="collection">Collection</label>
                        <input type="text" id="collection" placeholder="ex: mes_documents" required autocomplete="off">
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="btn-submit" class="btn btn-submit">
                        <span class="spinner" id="btn-spinner"></span>
                        <span id="btn-text">Exporter en CSV</span>
                    </button>
                    
                    <button type="button" class="btn btn-secondary" onclick="useTestConfig()">
                        Utiliser la configuration de test
                    </button>
                </div>
            </form>
        </div>

        <footer>
            Développé avec FastAPI, Pydantic et Pandas
        </footer>
    </div>

    <script>
        function switchMode(mode) {
            document.getElementById('connection-mode').value = mode;
            const tabs = document.querySelectorAll('.tab-btn');
            
            if (mode === 'uri') {
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                document.getElementById('uri-fields').classList.remove('hidden');
                document.getElementById('credentials-fields').classList.add('hidden');
            } else {
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                document.getElementById('uri-fields').classList.add('hidden');
                document.getElementById('credentials-fields').classList.remove('hidden');
            }
            // Clear current alert
            hideAlert();
        }

        function useTestConfig() {
            // Switch to URI mode
            switchMode('uri');
            // Fill fields with original test credentials
            document.getElementById('uri').value = 'mongodb+srv://nosleepman:<password>@<username>.xxxxxxx.mongodb.net/?appName=your_app_name';
            document.getElementById('db').value = 'your_database';
            document.getElementById('collection').value = 'your_collection';
            showAlert('Configuration de test chargée !', 'success');
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';
        }

        async function handleExport(event) {
            event.preventDefault();
            hideAlert();

            const mode = document.getElementById('connection-mode').value;
            const db = document.getElementById('db').value.trim();
            const collection = document.getElementById('collection').value.trim();

            const payload = { db, collection };

            if (mode === 'uri') {
                const uri = document.getElementById('uri').value.trim();
                if (!uri) {
                    showAlert('Veuillez spécifier l\'URI de connexion MongoDB.', 'error');
                    return;
                }
                payload.uri = uri;
            } else {
                const cluster = document.getElementById('cluster').value.trim();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!cluster || !username || !password) {
                    showAlert('Veuillez remplir tous les champs du cluster (hôte, utilisateur et mot de passe).', 'error');
                    return;
                }
                payload.cluster = cluster;
                payload.username = username;
                payload.password = password;
            }

            // Set loading state
            const btnSubmit = document.getElementById('btn-submit');
            const spinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');

            btnSubmit.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Connexion & Exportation...';

            try {
                const response = await fetch('/export-csv', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errMsg = 'Erreur lors de l\'exportation';
                    try {
                        const errorData = await response.json();
                        if (errorData && errorData.detail) {
                            if (typeof errorData.detail === 'string') {
                                errMsg = errorData.detail;
                            } else if (Array.isArray(errorData.detail)) {
                                // Formate les erreurs de validation de Pydantic (ex: "db : Field required")
                                errMsg = errorData.detail.map(err => {
                                    const fieldPath = err.loc ? err.loc.filter(l => l !== 'body').join('.') : '';
                                    return fieldPath ? `${fieldPath} : ${err.msg}` : err.msg;
                                }).join(' | ');
                            } else {
                                errMsg = JSON.stringify(errorData.detail);
                            }
                        }
                    } catch (e) {
                        errMsg = `Erreur HTTP ${response.status} : ${response.statusText}`;
                    }
                    throw new Error(errMsg);
                }

                // Retrieve CSV as a blob
                const blob = await response.blob();
                
                // Get file name from header if present
                let filename = `${collection}_export.csv`;
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                // Create download link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                showAlert('Exportation réussie ! Le téléchargement a commencé.', 'success');
            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                // Reset button state
                btnSubmit.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Exporter en CSV';
            }
        }
    </script>
</body>
</html>
